name: API contract and enquiry regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openapi-spec-validator==0.7.2
      - run: python -m openapi_spec_validator docs/api/openapi.json
      - run: python -m unittest discover -s scripts/api -p test_compatibility.py
      - name: Preserve released API operation shapes
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_REVISION:docs/api/openapi.json" 2>/dev/null; then
            git show "$BASE_REVISION:docs/api/openapi.json" > "$RUNNER_TEMP/opes-api-baseline.json"
            correction_args=()
          else
            cp docs/api/baselines/0.3.0.json "$RUNNER_TEMP/opes-api-baseline.json"
            correction_args=(--corrections docs/api/compatibility-exceptions.json --corrections docs/api/compatibility-exceptions-0.47.json)
          fi
          python scripts/api/check_compatibility.py "$RUNNER_TEMP/opes-api-baseline.json" docs/api/openapi.json "${correction_args[@]}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sdk/node/test/*.test.mjs
      - run: npm pack --ignore-scripts --dry-run
        working-directory: sdk/node
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --no-dev --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Keep OpenAPI and SDK operations generated from the workflow registry
        run: |
          php scripts/api/build_business_contract.php
          php scripts/api/generate_business_sdk_operations.php
          git diff --exit-code -- docs/api/openapi.json sdk/node/src/business-operations.js sdk/node/src/business-operations.d.ts
      - name: Require shared application workflows for named web routes
        run: php scripts/api/audit_web_adapters.php
      - run: php artisan test --compact tests/Feature/EnquiriesApiTest.php tests/Feature/WebsiteFormDeliveryTest.php tests/Feature/EnquiryReliabilityTest.php tests/Feature/ApiIdentityTest.php
