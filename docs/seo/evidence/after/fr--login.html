<body class="auth-body">
    <div class="auth-wrapper">
        <a href="https://opeshealthsystems.com" class="auth-brand">
            <img src="https://opeshealthsystems.com/images/opes-seal.png" alt="OPES Health Systems seal" width="72" height="72" style="object-fit:contain;margin:0 auto 12px">
            <span class="auth-brand-opes">OPES</span>
            <span class="auth-brand-name"> Health Systems</span>
        </a>
        <div class="auth-card">
        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-subheading">Sign in to your OPES account</p>

        
        
        <form id="login-form" method="POST" action="https://opeshealthsystems.com/login" class="auth-form">
            <input type="hidden" name="_token" value="xk33sBVyUsFEs48mcrnxBwVMScUqQ0au9nPSrISg" autocomplete="off">            <input type="hidden" name="locale" value="en">

            <div class="auth-field">
                <label for="email" class="auth-label">Email address</label>
                <input
                    id="email" name="email" type="email"
                    class="auth-input "
                    value=""
                    required autofocus autocomplete="email"
                    placeholder="you@facility.cm"
                >
            </div>

            <div class="auth-field">
                <label for="password" class="auth-label">Password</label>
                <input
                    id="password" name="password" type="password"
                    class="auth-input"
                    required autocomplete="current-password"
                    placeholder="••••••••"
                >
            </div>

            <div class="auth-remember" style="display:flex;align-items:center;justify-content:space-between;">
                <label class="auth-check-label">
                    <input type="checkbox" name="remember" class="auth-check"> Remember me
                </label>
                <a href="https://opeshealthsystems.com/forgot-password" class="auth-link" style="font-size:0.8rem;">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>
        </form>

        <p class="auth-switch">
            Don't have an account?
